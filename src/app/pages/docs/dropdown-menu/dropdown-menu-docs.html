<div class="p-16 flex flex-col gap-16 max-w-3xl mx-auto">
  <h1 class="text-heading-xl text-text-primary">Dropdown Menu</h1>

  <app-api-table [doc]="api" />

  <section class="flex flex-col gap-6"> 
    <h2 class="text-label-lg text-text-subdued">Basic</h2>
    <ui-dropdown-menu>
      <ng-template uiTemplate="button">Options</ng-template>
      <ng-template uiTemplate="menu">
        <ul class="flex flex-col p-2 min-w-[160px]">
          <li
            role="menuitem"
            tabindex="-1"
            class="px-6 py-4 rounded text-label-md text-neutral-500 cursor-pointer outline-none hover:bg-neutral-300 focus:bg-neutral-300"
          >
            Profile
          </li>
          <li
            role="menuitem"
            tabindex="-1"
            class="px-6 py-4 rounded text-label-md text-neutral-500 cursor-pointer outline-none hover:bg-neutral-300 focus:bg-neutral-300"
          >
            Settings
          </li>
          <li
            role="menuitem"
            tabindex="-1"
            class="px-6 py-4 rounded text-label-md text-neutral-500 cursor-pointer outline-none hover:bg-neutral-300 focus:bg-neutral-300"
          >
            Log out
          </li>
        </ul>
      </ng-template>
    </ui-dropdown-menu>
    <p class="text-paragraph-sm text-text-subdued">
      Arrow Up/Down move focus between items, Home/End jump to the ends, Escape closes and returns
      focus to the trigger.
    </p>
    <docs-code-tabs [html]="basicHtml" [ts]="basicTs" />
  </section>

  <section class="flex flex-col gap-6">
    <h2 class="text-label-lg text-text-subdued">Disabled</h2>
    <ui-dropdown-menu [disabled]="true">
      <ng-template uiTemplate="button">Disabled</ng-template>
    </ui-dropdown-menu>
    <docs-code-tabs [html]="disabledHtml" [ts]="disabledTs" />
  </section>
</div>
