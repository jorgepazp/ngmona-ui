<div class="p-16 flex flex-col gap-8 max-w-4xl mx-auto">
  <h1 class="text-heading-xl text-text-primary">Data Table</h1>

  <app-api-table [doc]="api" />

  <div class="flex items-center gap-4 flex-wrap">
    <ui-button size="sm" variant="secondary" (clicked)="toggleLoading()">Simulate loading</ui-button>
    <ui-button size="sm" variant="secondary" (clicked)="clearData()">Show empty state</ui-button>
    <ui-button size="sm" variant="secondary" (clicked)="resetData()">Reset data</ui-button>
    <span class="text-paragraph-sm text-text-subdued">selected = {{ selected().length }}</span>
  </div>

  <ui-data-table
    [data]="users()"
    [columns]="columns"
    [rowKey]="rowKey"
    selectable="multi"
    [(selected)]="selected"
    [loading]="loading()"
    [pageSize]="10"
    ariaLabel="Users"
  >
    <ng-template uiTemplate="cell-status" let-row>
      <ui-badge class="inline-block px-3 py-1 rounded-full text-label-xs font-semibold" [variant]="statusClass(row.status)">
        {{ row.status }}
        
      </ui-badge>
  
    </ng-template>
    <ng-template uiTemplate="empty">
      <span>No users match; try resetting the data.</span>
    </ng-template>
  </ui-data-table>
  <docs-code-tabs [html]="basicHtml" [ts]="basicTs" />
</div>
