<div class="p-16 flex flex-col gap-16 max-w-3xl mx-auto">
  <h1 class="text-heading-xl text-text-primary">Popover</h1>

  <app-api-table [doc]="api" />

  <section class="flex flex-col gap-6">
    <ui-popover [(open)]="open" [panelClass]="'w-128'">
      <ui-button trigger>Toggle popover</ui-button>
      <div class="flex flex-col gap-2">
        <p class="text-label-md text-text-primary font-semibold">Popover content</p>
        <p class="text-paragraph-sm text-text-subdued">Any content can go here; it's only rendered while the popover is open.</p>
      </div>
    </ui-popover>
    <p class="text-paragraph-sm text-text-subdued">open = {{ open() }}</p>
    <docs-code-tabs [html]="basicHtml" [ts]="basicTs" />
  </section>
</div>
