<div class="p-8 flex flex-col gap-8 max-w-3xl mx-auto">
  <h1 class="text-heading-xl text-text-primary">Combobox</h1>

  <app-api-table [doc]="api" />

  <section class="flex flex-col gap-3 max-w-xs">
    <h2 class="text-label-lg text-text-subdued">Pick a fruit</h2>
    <ui-combobox [options]="fruits" [(value)]="fruit" placeholder="Search fruit…" label="Fruit"></ui-combobox>
    <p class="text-paragraph-sm text-text-subdued">
      value = {{ fruitLabel() }}
    </p>
    <p class="text-paragraph-sm text-text-subdued">
      Type to filter, use Arrow Up/Down + Enter to select, Escape to close. "Peach" is disabled and can't be picked.
    </p>
    <docs-code-tabs [html]="basicHtml" [ts]="basicTs" />
  </section>
</div>
