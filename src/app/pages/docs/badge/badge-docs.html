<div class="p-8 flex flex-col gap-8 max-w-3xl mx-auto">
  <h1 class="text-heading-xl text-text-primary">Badge</h1>

  <app-api-table [doc]="api" />

  <section class="flex flex-col gap-3">
    <h2 class="text-label-lg text-text-subdued">Variants</h2>
    <div class="flex items-center gap-3">
      <ui-badge variant="primary">Primary</ui-badge>
      <ui-badge variant="neutral">Neutral</ui-badge>
      <ui-badge variant="success">Success</ui-badge>
      <ui-badge variant="warning">Warning</ui-badge>
      <ui-badge variant="danger">Danger</ui-badge>
      <ui-badge variant="info">Info</ui-badge>
    </div>
  </section>

  <section class="flex flex-col gap-3">
    <h2 class="text-label-lg text-text-subdued">Sizes</h2>
    <div class="flex items-center gap-3">
      <ui-badge size="sm" variant="primary">Small</ui-badge>
      <ui-badge size="md" variant="primary">Medium</ui-badge>
    </div>
  </section>

  <section class="flex flex-col gap-3">
    <h2 class="text-label-lg text-text-subdued">With icon</h2>
    <div class="flex items-center gap-3">
      <ui-badge variant="success" [icon]="checkIcon">Verified</ui-badge>
    </div>
  </section>

  <section class="flex flex-col gap-3">
    <h2 class="text-label-lg text-text-subdued">Shape</h2>
    <div class="flex items-center gap-3">
      <ui-badge variant="info" [pill]="true">Pill</ui-badge>
      <ui-badge variant="info" [pill]="false">Square</ui-badge>
    </div>
  </section>
</div>
