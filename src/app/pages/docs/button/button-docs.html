<div class="p-16 flex flex-col gap-16 max-w-3xl mx-auto">
  <h1 class="text-heading-xl text-text-primary">Button</h1>

  <app-api-table [doc]="api" />

  <section class="flex flex-col gap-6">
    <h2 class="text-label-lg text-text-subdued">Variants</h2>
    <div class="flex items-center gap-6">
      <ui-button variant="primary">Primary</ui-button>
      <ui-button variant="secondary">Secondary</ui-button>
      <ui-button variant="tertiary">Tertiary</ui-button>
      <ui-button variant="icon" [icon]="heartIcon" ariaLabel="Like"></ui-button>
    </div>
    <docs-code-tabs [html]="variantsHtml" [ts]="variantsTs" />
  </section>

  <section class="flex flex-col gap-6">
    <h2 class="text-label-lg text-text-subdued">States</h2>
    <div class="flex items-center gap-6">
      <ui-button [disabled]="true">Disabled</ui-button>
      <ui-button [loading]="true">Loading</ui-button>
      <ui-button [icon]="downloadIcon" iconPos="left">With icon</ui-button>
    </div>
    <docs-code-tabs [html]="statesHtml" [ts]="statesTs" />
  </section>

  <section class="flex flex-col gap-6">
    <h2 class="text-label-lg text-text-subdued">Sizes</h2>
    <div class="flex items-center gap-6">
      <ui-button size="sm">Small</ui-button>
      <ui-button size="md">Medium</ui-button>
      <ui-button size="default">Default</ui-button>
      <ui-button size="xl">Extra large</ui-button>
    </div>
    <docs-code-tabs [html]="sizesHtml" [ts]="sizesTs" />
  </section>

  <section class="flex flex-col gap-6 bg-neutral-500 p-8 rounded">
    <h2 class="text-label-lg text-white">Inverse (on dark surface)</h2>
    <div class="flex items-center gap-6">
      <ui-button [inverse]="true">Primary</ui-button>
      <ui-button variant="secondary" [inverse]="true">Secondary</ui-button>
      <ui-button variant="tertiary" [inverse]="true">Tertiary</ui-button>
    </div>
    <docs-code-tabs [html]="inverseHtml" [ts]="inverseTs" />
  </section>
</div>
