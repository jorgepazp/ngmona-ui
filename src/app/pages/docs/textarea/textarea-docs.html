<div class="p-8 flex flex-col gap-8 max-w-3xl mx-auto">
  <h1 class="text-heading-xl text-text-primary">Textarea</h1>

  <app-api-table [doc]="api" />

  <section class="flex flex-col gap-3">
    <ui-textarea label="Feedback" placeholder="Tell us what you think" [(value)]="text" [maxLength]="140"></ui-textarea>
    <p class="text-paragraph-sm text-text-subdued">length = {{ text().length }}</p>
  </section>

  <section class="flex flex-col gap-3">
    <ui-textarea label="Disabled" [disabled]="true" placeholder="Can't type here"></ui-textarea>
  </section>
</div>
