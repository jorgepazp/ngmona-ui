<div class="p-8 flex flex-col gap-8 max-w-3xl mx-auto">
  <h1 class="text-heading-xl text-text-primary">Spinner</h1>

  <app-api-table [doc]="api" />

  <section class="flex flex-col gap-3">
    <h2 class="text-label-lg text-text-subdued">Sizes</h2>
    <div class="flex items-center gap-4">
      <ui-spinner [size]="24"></ui-spinner>
      <ui-spinner [size]="36"></ui-spinner>
      <ui-spinner [size]="52"></ui-spinner>
    </div>
  </section>

  <section class="flex flex-col gap-3">
    <h2 class="text-label-lg text-text-subdued">Color</h2>
    <div class="flex items-center gap-4">
      <ui-spinner [size]="36" classNames="text-primary-500"></ui-spinner>
      <ui-spinner [size]="36" classNames="text-accent-500"></ui-spinner>
      <ui-spinner [size]="36" classNames="text-neutral-300"></ui-spinner>
    </div>
  </section>

  <section class="flex flex-col gap-3">
    <h2 class="text-label-lg text-text-subdued">Custom label</h2>
    <ui-spinner [size]="36" ariaLabel="Saving changes"></ui-spinner>
  </section>
</div>
