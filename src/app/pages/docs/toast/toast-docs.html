<div class="p-16 flex flex-col gap-16 max-w-3xl mx-auto">
  <h1 class="text-heading-xl text-text-primary">Toast</h1>

  <app-api-table [doc]="api" />

  <p class="text-paragraph-sm text-text-subdued">
    Inject <code>ToastService</code> anywhere and call <code>toast.show(...)</code>. A single
    <code>&lt;ui-toaster /&gt;</code> mounted once in the app shell renders and stacks them.
  </p>

  <section class="flex flex-wrap gap-6">
    <button uiButton (click)="toast.show('Here is a message')">Default</button>
    <button uiButton (click)="toast.success('Saved successfully')">Success</button>
    <button uiButton (click)="toast.error('Something went wrong')">Error</button>
    <button uiButton (click)="toast.warning('Careful with that')">Warning</button>
    <button uiButton (click)="toast.show('Bottom left', { position: 'bottom-left' })">Bottom left</button>
  </section>
  <docs-code-tabs [html]="basicHtml" [ts]="basicTs" />
</div>
