<div class="p-8 flex flex-col gap-8 max-w-3xl mx-auto">
  <h1 class="text-heading-xl text-text-primary">Progress</h1>

  <app-api-table [doc]="api" />

  <section class="flex flex-col gap-3">
    <h2 class="text-label-lg text-text-subdued">Values</h2>
    <div class="flex flex-col gap-3">
      <ui-progress [value]="25" ariaLabel="Upload progress"></ui-progress>
      <ui-progress [value]="60" ariaLabel="Upload progress"></ui-progress>
      <ui-progress [value]="100" ariaLabel="Upload progress"></ui-progress>
    </div>
  </section>

  <section class="flex flex-col gap-3">
    <h2 class="text-label-lg text-text-subdued">Indeterminate</h2>
    <ui-progress ariaLabel="Loading"></ui-progress>
  </section>

  <section class="flex flex-col gap-3">
    <h2 class="text-label-lg text-text-subdued">Sizes</h2>
    <div class="flex flex-col gap-3">
      <ui-progress size="sm" [value]="45" ariaLabel="Progress"></ui-progress>
      <ui-progress size="md" [value]="45" ariaLabel="Progress"></ui-progress>
      <ui-progress size="lg" [value]="45" ariaLabel="Progress"></ui-progress>
    </div>
  </section>

  <section class="flex flex-col gap-3">
    <h2 class="text-label-lg text-text-subdued">Variants</h2>
    <div class="flex flex-col gap-3">
      <ui-progress variant="primary" [value]="70" ariaLabel="Progress"></ui-progress>
      <ui-progress variant="success" [value]="70" ariaLabel="Progress"></ui-progress>
      <ui-progress variant="warning" [value]="70" ariaLabel="Progress"></ui-progress>
      <ui-progress variant="danger" [value]="70" ariaLabel="Progress"></ui-progress>
      <ui-progress variant="info" [value]="70" ariaLabel="Progress"></ui-progress>
    </div>
  </section>

  <section class="flex flex-col gap-3">
    <h2 class="text-label-lg text-text-subdued">Custom value text</h2>
    <ui-progress [value]="3" [max]="5" valueText="3 of 5 steps complete" ariaLabel="Setup progress"></ui-progress>
  </section>
</div>
