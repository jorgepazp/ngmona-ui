<div class="p-16 flex flex-col gap-16 max-w-3xl mx-auto">
  <h1 class="text-heading-xl text-text-primary">Resizable</h1>

  <app-api-table [doc]="api" />

  <p class="text-paragraph-sm text-text-subdued">
    Drag a handle, or focus one and use the arrow keys (Home/End to jump to an edge). The group
    needs an explicit height from its container: set it via <code>classNames</code>.
  </p>

  <section class="flex flex-col gap-6">
    <h2 class="text-label-lg text-text-subdued">Horizontal, 2 panes</h2>
    <ui-resizable direction="horizontal" classNames="h-128">
      <div uiResizablePane [defaultSize]="30" [minSize]="15" class="flex items-center justify-center bg-neutral-100 text-text-subdued text-label-md">
        Sidebar
      </div>
      <div uiResizablePane [defaultSize]="70" [minSize]="30" class="flex items-center justify-center bg-surface-white text-text-subdued text-label-md">
        Main content
      </div>
    </ui-resizable>
    <docs-code-tabs [html]="horizontalHtml" [ts]="horizontalTs" />
  </section>

  <section class="flex flex-col gap-6">
    <h2 class="text-label-lg text-text-subdued">Vertical, 3 panes</h2>
    <ui-resizable direction="vertical" classNames="h-192">
      <div uiResizablePane [minSize]="10" class="flex items-center justify-center bg-neutral-100 text-text-subdued text-label-md">
        Header
      </div>
      <div uiResizablePane [minSize]="20" class="flex items-center justify-center bg-surface-white text-text-subdued text-label-md">
        Body
      </div>
      <div uiResizablePane [minSize]="10" class="flex items-center justify-center bg-neutral-100 text-text-subdued text-label-md">
        Footer
      </div>
    </ui-resizable>
    <docs-code-tabs [html]="verticalHtml" [ts]="verticalTs" />
  </section>
</div>
