<div class="p-16 flex flex-col gap-16 max-w-3xl mx-auto">
  <h1 class="text-heading-xl text-text-primary">Notification</h1>

  <app-api-table [doc]="api" />

  <section class="flex flex-col gap-6">
    <h2 class="text-label-lg text-text-subdued">Types (queued FIFO, auto-dismiss after 3s)</h2>
    <p class="text-paragraph-sm text-text-subdued">
      Only one notification is ever on screen. Clicking several buttons in a row queues them up
      and plays them back one at a time, in the order they were triggered.
    </p>
    <div class="flex flex-wrap items-center gap-6">
      <ui-button size="sm" (clicked)="trigger('info')">Info</ui-button>
      <ui-button size="sm" (clicked)="trigger('success')">Success</ui-button>
      <ui-button size="sm" (clicked)="trigger('warning')">Warning</ui-button>
      <ui-button size="sm" (clicked)="trigger('error')">Error</ui-button>
      <ui-button size="sm" (clicked)="trigger('neutral')">Basic</ui-button>
    </div>
  </section>

  <ui-notification
    [show]="show()"
    [type]="currentType() ?? 'info'"
    position="top-center"
    (closed)="dismiss()"
  >
    <span class="text-label-sm">{{ currentMessage() }}</span>
  </ui-notification>

  <docs-code-tabs [html]="basicHtml" [ts]="basicTs" />
</div>
