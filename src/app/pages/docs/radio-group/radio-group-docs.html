<div class="p-8 flex flex-col gap-8 max-w-3xl mx-auto">
  <h1 class="text-heading-xl text-text-primary">Radio Group</h1>

  <app-api-table [doc]="api" />

  <section class="flex flex-col gap-3">
    <h2 class="text-label-lg text-text-subdued">List</h2>
    <ui-radio-group [options]="options" [(ngModel)]="fruit" ariaLabel="Fruit"></ui-radio-group>
    <p class="text-paragraph-sm text-text-subdued">selected = {{ fruit }}</p>
  </section>

  <section class="flex flex-col gap-3">
    <h2 class="text-label-lg text-text-subdued">Chips</h2>
    <ui-radio-group [options]="options" type="chips" [(ngModel)]="fruit" ariaLabel="Fruit"></ui-radio-group>
  </section>
</div>
