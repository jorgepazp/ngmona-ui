<div class="p-8 flex flex-col gap-8 max-w-3xl mx-auto">
  <h1 class="text-heading-xl text-text-primary">Link</h1>

  <app-api-table [doc]="api" />

  <section class="flex flex-col gap-3">
    <h2 class="text-label-lg text-text-subdued">Underline behavior</h2>
    <div class="flex items-center gap-4">
      <ui-link href="#">Hover (default)</ui-link>
      <ui-link href="#" underline="always">Always</ui-link>
      <ui-link href="#" underline="none">None</ui-link>
    </div>
  </section>

  <section class="flex flex-col gap-3">
    <h2 class="text-label-lg text-text-subdued">With icon</h2>
    <div class="flex items-center gap-4">
      <ui-link href="#" [icon]="arrowIcon" iconPos="right">Continue</ui-link>
      <ui-link href="https://example.com" target="_blank">Opens in a new tab</ui-link>
    </div>
  </section>

  <section class="flex flex-col gap-3">
    <h2 class="text-label-lg text-text-subdued">States</h2>
    <ui-link href="#" [disabled]="true">Disabled</ui-link>
  </section>
</div>
