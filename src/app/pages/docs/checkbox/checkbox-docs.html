<div class="p-8 flex flex-col gap-8 max-w-3xl mx-auto">
  <h1 class="text-heading-xl text-text-primary">Checkbox</h1>

  <app-api-table [doc]="api" />

  <section class="flex flex-col gap-3">
    <h2 class="text-label-lg text-text-subdued">Two-way binding</h2>
    <ui-checkbox [(checked)]="isChecked" label="Accept terms"></ui-checkbox>
    <p class="text-paragraph-sm text-text-subdued">checked = {{ isChecked() }}</p>
    <docs-code-tabs [html]="bindingHtml" [ts]="bindingTs" />
  </section>

  <section class="flex flex-col gap-3">
    <h2 class="text-label-lg text-text-subdued">States</h2>
    <ui-checkbox label="Unchecked"></ui-checkbox>
    <ui-checkbox [checked]="true" label="Checked"></ui-checkbox>
    <ui-checkbox [disabled]="true" label="Disabled"></ui-checkbox>
    <ui-checkbox [checked]="true" [disabled]="true" label="Disabled + checked"></ui-checkbox>
    <docs-code-tabs [html]="statesHtml" [ts]="statesTs" />
  </section>
</div>
