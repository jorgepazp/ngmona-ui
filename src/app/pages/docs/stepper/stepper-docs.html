<div class="p-8 flex flex-col gap-8 max-w-3xl mx-auto">
  <h1 class="text-heading-xl text-text-primary">Stepper</h1>

  <app-api-table [doc]="api" />

  <section class="flex flex-col gap-3">
    <h2 class="text-label-lg text-text-subdued">Interactive, with labels</h2>
    <ui-stepper [labels]="labels" [currentStep]="current()"></ui-stepper>
    <div class="flex gap-2">
      <ui-button variant="secondary" size="sm" [disabled]="current() === 0" (clicked)="back()">Back</ui-button>
      <ui-button size="sm" [disabled]="current() === labels.length - 1" (clicked)="forward()">Next</ui-button>
    </div>
  </section>

  <section class="flex flex-col gap-3">
    <h2 class="text-label-lg text-text-subdued">No labels, 5 steps</h2>
    <ui-stepper [steps]="5" [currentStep]="2"></ui-stepper>
  </section>

  <section class="flex flex-col gap-3">
    <h2 class="text-label-lg text-text-subdued">All completed</h2>
    <ui-stepper [labels]="labels" [currentStep]="labels.length"></ui-stepper>
  </section>
</div>
