<div class="p-16 flex flex-col gap-16 max-w-3xl mx-auto">
  <h1 class="text-heading-xl text-text-primary">Stepper</h1>

  <app-api-table [doc]="api" />

  <section class="flex flex-col gap-6">
    <h2 class="text-label-lg text-text-subdued">Interactive, with labels</h2>
    <ui-stepper [labels]="labels" [currentStep]="current()"></ui-stepper>
    <div class="flex gap-4">
      <button uiButton variant="secondary" size="sm" [disabled]="current() === 0" (click)="back()">Back</button>
      <button uiButton size="sm" [disabled]="current() === labels.length - 1" (click)="forward()">Next</button>
    </div>
    <docs-code-tabs [html]="interactiveHtml" [ts]="interactiveTs" />
  </section>

  <section class="flex flex-col gap-6">
    <h2 class="text-label-lg text-text-subdued">No labels, 5 steps</h2>
    <ui-stepper [steps]="5" [currentStep]="2"></ui-stepper>
    <docs-code-tabs [html]="noLabelsHtml" [ts]="noLabelsTs" />
  </section>

  <section class="flex flex-col gap-6">
    <h2 class="text-label-lg text-text-subdued">All completed</h2>
    <ui-stepper [labels]="labels" [currentStep]="labels.length"></ui-stepper>
    <docs-code-tabs [html]="completedHtml" [ts]="completedTs" />
  </section>
</div>
