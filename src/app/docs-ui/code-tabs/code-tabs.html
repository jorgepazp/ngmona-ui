@if (tabs().length > 0) {
  <div class="docs-code w-full rounded-lg border border-divider overflow-hidden bg-neutral-900">
    <div class="flex gap-1 border-b border-white/10 px-2 pt-2">
      @for (tab of tabs(); track tab) {
        <button
          type="button"
          class="rounded-t px-2.5 py-1.5 text-label-xs font-medium transition-colors cursor-pointer"
          [class.text-white]="activeTab() === tab"
          [class.bg-white/10]="activeTab() === tab"
          [class.text-white/50]="activeTab() !== tab"
          (click)="select(tab)"
        >
          {{ tab === 'html' ? 'HTML' : 'TS' }}
        </button>
      }
    </div>
    <pre class="!m-0 overflow-x-auto p-3 text-label-xs leading-relaxed"><code [class]="languageClass()" [innerHTML]="highlighted()"></code></pre>
  </div>
}
