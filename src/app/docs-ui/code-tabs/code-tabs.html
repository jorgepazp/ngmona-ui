@if (tabs().length > 0) {
  <div class="docs-code w-full rounded-lg border border-divider overflow-hidden bg-neutral-900">
    <div class="flex gap-2 border-b border-white/10 px-4 pt-4">
      @for (tab of tabs(); track tab) {
        <button
          type="button"
          class="rounded-t px-5 py-3 text-label-xs font-semibold transition-colors cursor-pointer"
          [class.text-white]="activeTab() === tab"
          [class.bg-white/10]="activeTab() === tab"
          [class.text-white/50]="activeTab() !== tab"
          (click)="select(tab)"
        >
          {{ tab === 'html' ? 'HTML' : 'TS' }}
        </button>
      }
    </div>
    <pre class="!m-0 overflow-x-auto p-6 text-label-xs leading-relaxed" [class]="languageClass()"><code [class]="languageClass()" [innerHTML]="highlighted()"></code></pre>
  </div>
}
