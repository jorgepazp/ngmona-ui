<label class="flex gap-1.5 items-center select-none " [class]="isDisabled() ? 'cursor-not-allowed' : 'cursor-pointer'">
  <span class="relative block w-2 h-2 rounded shrink-0 mt-px transition-all" [class]="checked() || indeterminate() ? 'active:shadow-primary-300' : 'active:shadow-neutral-600'">
    <span
      class="absolute transition-opacity w-2 h-2 top-0 z-10 flex items-center justify-center rounded text-surface-white"
      [class]="(checked() || indeterminate() ? '' : 'opacity-0 text-surface-white') + (isDisabled() ? '!bg-text-disabled' : 'bg-surface-active text-white')"
      aria-hidden="true"
    >
      <svg [lucideIcon]="indeterminate() ? minusIcon : checkIcon"  [size]="12"></svg>
    </span>
    <input
      type="checkbox"
      class="custom-input absolute cursor-pointer z-0 appearance-none outline-none w-2 h-2 focus:outline-none  bg-surface-white ring-0 ring-offset-0 outline-0 focus:ring-0 focus:ring-offset-0 rounded border-2 border-solid"
      [class]="isDisabled() ? 'border-text-disabled' : 'border-text-primary'"
      [disabled]="isDisabled()"
      [checked]="checked()"
      [indeterminate]="indeterminate()"
      [attr.aria-checked]="ariaChecked()"
      (change)="toggle($event)"
      (blur)="markTouched()"
    />
  </span>
  @if (labelTemplate(); as tpl) {
    <span class="text-label-md mt-0 whitespace-normal w-full " [class]="isDisabled() ? 'text-text-disabled' : 'text-text-primary'">
      <ng-container [ngTemplateOutlet]="tpl"></ng-container>
    </span>
  } @else if (label()) {
    <span class="text-label-md mt-0 whitespace-normal w-full " [class]="isDisabled() ? 'text-text-disabled' : 'text-text-primary'">{{ label() }}</span>
  }
</label>
