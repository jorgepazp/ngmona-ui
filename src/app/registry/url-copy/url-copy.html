<button
  type="button"
  (click)="copyUrl()"
  [class]="
    'mt-2 inline-flex w-fit cursor-pointer items-center gap-1 rounded border border-neutral-800 p-1 transition-colors hover:bg-neutral-300 ' +
    classNames()
  "
>
  @if (isCopied()) {
    <svg lucideCheck [size]="16" class="text-success-500"></svg>
  } @else {
    <svg lucideCopy [size]="16" class="text-icon-subdued"></svg>
  }
  <span class="w-[170px] overflow-hidden text-ellipsis whitespace-nowrap text-left text-label-xs text-link">{{
    url()
  }}</span>
  <span class="border-l border-neutral-800 pl-1 text-label-xs font-bold text-neutral-800" aria-live="polite">{{
    displayLabel()
  }}</span>
</button>
