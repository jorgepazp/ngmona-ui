@if (open()) {
  <div class="fixed inset-0 z-[9999] flex items-start justify-center pt-[15vh]">
    <div
      class="absolute inset-0 bg-surface-backdrop"
      aria-hidden="true"
      animate.enter="ui-anim-fade-enter"
      animate.leave="ui-anim-fade-leave"
      (click)="onBackdropClick()"
    ></div>

    <div
      #panel
      class="relative z-10 flex w-full max-w-lg flex-col overflow-hidden rounded-lg bg-surface-white shadow-hover"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="'Command palette'"
      tabindex="-1"
      animate.enter="ui-anim-fade-enter"
      animate.leave="ui-anim-fade-leave"
      (keydown.tab)="onKeydownTab($event)"
    >
      <div class="flex items-center gap-2 border-b border-border-neutral !px-3">
        <svg [lucideIcon]="searchIcon" [size]="16" class="shrink-0 text-text-subdued"></svg>
        <input
          #searchInput
          type="text"
          role="combobox"
          autocomplete="off"
          [placeholder]="placeholder()"
          [value]="query()"
          aria-autocomplete="list"
          [attr.aria-expanded]="true"
          [attr.aria-controls]="listboxId"
          [attr.aria-activedescendant]="flatItems().length ? itemDomId(activeIndex()) : null"
          (input)="onQueryChange($event)"
          (keydown)="onSearchKeydown($event)"
          class="w-full border-none bg-transparent !py-2.5 text-label-md text-text-primary outline-none placeholder:text-text-subdued"
        />
      </div>

      <ul [id]="listboxId" role="listbox" class="!m-0 max-h-80 list-none overflow-y-auto !p-1.5">
        @for (group of filteredGroups(); track group.label) {
          <li role="group" [attr.aria-label]="group.label">
            <div class="!px-1.5 !pt-1.5 !pb-0.5 text-label-xs font-medium text-text-subdued">{{ group.label }}</div>
            <ul class="!m-0 list-none !p-0">
              @for (item of group.items; track item.value) {
                <li
                  [id]="itemDomId(flatItems().indexOf(item))"
                  role="option"
                  [attr.aria-selected]="flatItems().indexOf(item) === activeIndex()"
                  [attr.aria-disabled]="item.disabled || null"
                  (mousedown)="$event.preventDefault()"
                  (mouseenter)="activeIndex.set(flatItems().indexOf(item))"
                  (click)="executeItem(item)"
                  [class]="
                    (flatItems().indexOf(item) === activeIndex() ? 'bg-surface-light ' : '') +
                    (item.disabled ? 'opacity-50 pointer-events-none ' : '')
                  "
                  class="flex cursor-pointer select-none items-center gap-2 rounded !px-2 !py-1.5 text-label-sm text-neutral-500 hover:bg-surface-hover/30"
                >
                  @if (item.icon) {
                    <svg [lucideIcon]="item.icon" [size]="16" class="shrink-0 text-neutral-300"></svg>
                  }
                  <span class="truncate">{{ item.label }}</span>
                </li>
              }
            </ul>
          </li>
        } @empty {
          <li class="!px-2 !py-6 text-center text-label-sm text-text-subdued">{{ emptyText() }}</li>
        }
      </ul>

      <div class="flex items-center gap-3 border-t border-border-neutral !px-3 !py-1.5 text-label-xs text-text-subdued">
        <span class="flex items-center gap-1"><kbd class="rounded border border-border-neutral !px-1">↑↓</kbd> navigate</span>
        <span class="flex items-center gap-1"><kbd class="rounded border border-border-neutral !px-1">↵</kbd> select</span>
        <span class="flex items-center gap-1"><kbd class="rounded border border-border-neutral !px-1">esc</kbd> close</span>
      </div>
    </div>
  </div>
}
