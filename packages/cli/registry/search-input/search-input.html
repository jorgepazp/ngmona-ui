<div [class]="'flex flex-col ' + classNames()" role="search">
  @if (labelTemplate(); as tpl) {
    <div class="mb-1 text-text-subdued text-xs font-semibold flex justify-between">
      <ng-container [ngTemplateOutlet]="tpl"></ng-container>
    </div>
  } @else if (label()) {
    <label [attr.for]="resolvedId()" class="mb-1 text-text-subdued text-xs font-semibold block">{{ label() }}</label>
  }

  <div class="relative w-full group">
    <span class="pointer-events-none absolute left-4 top-2 bottom-2 flex items-center text-text-primary">
      <svg [lucideIcon]="searchIcon" [size]="16"></svg>
    </span>

    <input
      [id]="resolvedId()"
      [name]="resolvedId()"
      type="text"
      [disabled]="isDisabled()"
      [value]="value()"
      [placeholder]="placeholder()"
      [attr.aria-label]="!label() ? ariaLabel() : null"
      [attr.aria-describedby]="caption() || captionTemplate() ? captionId() : null"
      class="custom-input transition-all !pl-10 !py-2 text-label-md text-neutral-500 h-12 rounded ring-0 border-neutral-100 !border placeholder:text-neutral-300 placeholder:font-normal w-full disabled:placeholder:text-neutral-100 !border-solid group-hover:border-neutral-300 outline-[1.5px] font-semibold outline outline-transparent focus:!border-transparent focus:outline-neutral-800 disabled:bg-surface-disabled disabled:border-neutral-600 disabled:text-neutral-100"
      [class]="value() ? '!pr-12' : '!pr-4'"
      (input)="onInputEvent($event)"
      (blur)="markTouched()"
    />

    @if (value()) {
      <button
        type="button"
        aria-label="Clear search"
        class="cursor-pointer transition-all absolute right-4 top-2 bottom-2 flex justify-center items-center text-neutral-900 hover:text-neutral-500"
        (click)="clear()"
      >
        <svg [lucideIcon]="clearIcon" [size]="14"></svg>
      </button>
    }
  </div>

  @if (captionTemplate(); as tpl) {
    <div [id]="captionId()" class="mt-1 text-xs text-neutral-300">
      <ng-container [ngTemplateOutlet]="tpl"></ng-container>
    </div>
  } @else if (caption()) {
    <small [id]="captionId()" class="mt-1 text-xs text-neutral-300 block">{{ caption() }}</small>
  }
</div>
