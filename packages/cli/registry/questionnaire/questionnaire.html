@if (currentStep(); as step) {
  <div [class]="'flex flex-col gap-12 ' + classNames()">
    <p class="text-paragraph-sm text-text-subdued">Question {{ stepIndex() + 1 }} of {{ steps().length }}</p>

    <div class="flex flex-col gap-2">
      <h2 class="text-heading-sm text-text-primary">{{ step.title }}</h2>
      @if (step.subtitle) {
        <p class="text-paragraph-sm text-text-subdued">{{ step.subtitle }}</p>
      }
    </div>

    <div role="radiogroup" [attr.aria-label]="step.title" class="flex flex-col gap-4">
      @for (option of step.options; track option.id; let i = $index) {
        <button
          #optionRef
          type="button"
          role="radio"
          [attr.aria-checked]="isSelected(option.id)"
          [tabIndex]="tabIndexFor(i)"
          (click)="selectOption(option.id)"
          (keydown)="onOptionKeydown($event, i)"
          [class]="
            'flex items-start gap-6 text-left w-full rounded-lg border px-8 py-6 transition-colors cursor-pointer ' +
            (isSelected(option.id) ? 'border-primary-500 bg-primary-50' : 'border-divider hover:border-neutral-600')
          "
        >
          <span
            class="mt-1 w-6 h-6 rounded-full border-2 shrink-0 flex items-center justify-center"
            [class]="isSelected(option.id) ? 'border-primary-500' : 'border-neutral-600'"
            aria-hidden="true"
          >
            @if (isSelected(option.id)) {
              <span class="w-3 h-3 rounded-full bg-primary-500"></span>
            }
          </span>
          <span class="flex-1 flex flex-col gap-1">
            <span class="text-label-md font-semibold text-text-primary">{{ option.label }}</span>
            @if (option.description) {
              <span class="text-paragraph-sm text-text-subdued">{{ option.description }}</span>
            }
          </span>
          <span
            class="w-6 h-6 rounded-full border border-divider flex items-center justify-center text-label-xs text-text-subdued shrink-0"
            aria-hidden="true"
          >
            {{ letterFor(i) }}
          </span>
        </button>
      }
    </div>

    @if (step.otherPlaceholder) {
      <input
        type="text"
        [value]="otherDraft()"
        (input)="onOtherInput($any($event.target).value)"
        [placeholder]="step.otherPlaceholder"
        [attr.aria-label]="step.otherPlaceholder"
        class="w-full rounded-lg border border-divider px-8 py-6 text-label-md text-text-primary placeholder:text-text-subdued outline-none focus:border-primary-500 transition-colors bg-surface-white"
      />
    }

    <div class="flex items-center justify-between">
      @if (!isFirstStep()) {
        <button uiButton variant="tertiary" size="sm" (click)="back()">{{ backLabel() }}</button>
      } @else {
        <span></span>
      }
      <button uiButton variant="primary" [disabled]="!canAdvance()" (click)="next()">
        {{ isLastStep() ? finishLabel() : nextLabel() }}
      </button>
    </div>
  </div>
}
