<button
  type="button"
  (click)="copyUrl()"
  [class]="
    'mt-2 inline-flex w-fit cursor-pointer items-center gap-1 rounded border border-border-neutral p-1 transition-colors hover:bg-surface-enabled ' +
    classNames()
  "
>
  @if (isCopied()) {
    <svg lucideCheck [size]="16" class="text-success"></svg>
  } @else {
    <svg lucideCopy [size]="16" class="text-icon-subdued"></svg>
  }
  <span class="w-3xs overflow-hidden text-ellipsis whitespace-nowrap text-left text-label-xs text-link">{{
    url()
  }}</span>
  <span class="border-l border-border-neutral pl-3 text-label-xs text-text-subdued" aria-live="polite">{{
    displayLabel()
  }}</span>
</button>
