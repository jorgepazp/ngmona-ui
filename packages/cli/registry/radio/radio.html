<label class="cursor-pointer flex items-center gap-2 transition-color text-sm" [class]="isDisabled() ? 'text-neutral-100 cursor-not-allowed' : 'text-neutral-500'">
  <input
    type="radio"
    [name]="name()"
    [disabled]="isDisabled()"
    [checked]="checked()"
    [attr.aria-label]="!label() ? ariaLabel() ?? null : null"
    (change)="onInput($event)"
    (blur)="markTouched()"
    class="custom-input appearance-none transition-all active:shadow shadow-neutral-600 checked:!shadow-primary-200 relative cursor-pointer w-[20px] h-[20px] border-2 checked:border-primary-500 border-solid border-neutral-900 rounded-full bg-surface-white checked:after:content-[''] checked:after:w-[10px] after:opacity-0 checked:after:opacity-100 after:transition-opacity checked:after:h-[10px] checked:after:bg-primary-500 after:absolute after:rounded-full inline-flex justify-center items-center disabled:border-text-disabled disabled:checked:after:bg-text-disabled"
  />
  @if (label()) {
    <span class="select-none">{{ label() }}</span>
  }
</label>
