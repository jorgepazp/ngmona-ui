<label class="relative inline-flex items-center" [class]="isDisabled() ? 'cursor-not-allowed ' : 'cursor-pointer'">
  <input
    type="checkbox"
    [disabled]="isDisabled()"
    [checked]="checked()"
    [attr.aria-label]="ariaLabel() ?? null"
    (change)="onInput($event)"
    (blur)="markTouched()"
    class="sr-only peer"
  />
  <div
    class="transition-all bg-surface-light outline-none rounded-full peer peer-checked:after:translate-x-full peer-disabled:after:bg-white/60 peer-checked:after:border-white after:content-[''] after:absolute after:bg-white  after:border-none after:rounded-full after:transition-all after:shadow"
    [class]="trackClass()"
  ></div>
</label>
