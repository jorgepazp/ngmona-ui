@if (open()) {
  <div class="fixed inset-0 z-[9999]" (keydown)="onKeydown($event)">
    @if (backdrop()) {
      <div
        [animate.enter]="backdropEnterClass()"
        [animate.leave]="backdropLeaveClass()"
        class="fixed inset-0 bg-surface-backdrop"
        aria-hidden="true"
        (click)="onBackdropClick()"
      ></div>
    }
    <div
      #panel
      tabindex="-1"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="ariaLabel()"
      [animate.enter]="panelEnterClass()"
      [animate.leave]="panelLeaveClass()"
      [class]="panelClass()"
    >
      @if (showCloseButton()) {
        <button
          type="button"
          aria-label="Close"
          (click)="close()"
          class="absolute right-4 top-4 flex h-8 w-8 items-center justify-center rounded-full border-none bg-surface-light text-text-primary cursor-pointer transition-opacity hover:bg-surface-hover"
        >
          <svg [lucideIcon]="closeIcon" [size]="16"></svg>
        </button>
      }
      @if (headerTemplate(); as h) {
        <ng-container [ngTemplateOutlet]="h"></ng-container>
      }
      <div class="flex-1 overflow-y-auto">
        @if (contentTemplate(); as c) {
          <ng-container [ngTemplateOutlet]="c"></ng-container>
        } @else {
          <ng-content></ng-content>
        }
      </div>
      @if (footerTemplate(); as f) {
        <ng-container [ngTemplateOutlet]="f"></ng-container>
      }
    </div>
  </div>
}
