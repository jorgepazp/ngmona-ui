<nav [class]="'flex gap-1 justify-center items-center ' + classNames()" aria-label="Pagination">
  <button
    type="button"
    class="w-5 h-5 inline-flex items-center justify-center rounded transition-all cursor-pointer text-neutral-800 hover:enabled:bg-neutral-300 disabled:!cursor-not-allowed disabled:text-neutral-800"
    [disabled]="disabled() || !canGoPrevious()"
    (click)="previous()"
    aria-label="Previous page"
  >
    <svg lucideChevronLeft [size]="16"></svg>
  </button>

  @for (item of pages(); track $index) {
    @if (item === 'ellipsis') {
      <span class="w-5 h-5 flex items-center justify-center select-none text-neutral-300" aria-hidden="true">&hellip;</span>
    } @else {
      <button
        type="button"
        class="w-5 h-5 inline-flex items-center justify-center rounded text-label-sm transition-all cursor-pointer"
        [class]="item - 1 === page() ? 'bg-primary-500 text-white font-bold' : 'text-neutral-800 hover:bg-neutral-300'"
        [disabled]="disabled()"
        [attr.aria-current]="item - 1 === page() ? 'page' : null"
        [attr.aria-label]="'Page ' + item"
        (click)="goToPage(item - 1)"
      >
        {{ item }}
      </button>
    }
  }

  <button
    type="button"
    class="w-5 h-5 inline-flex items-center justify-center rounded transition-all cursor-pointer text-neutral-800 hover:enabled:bg-neutral-300 disabled:!cursor-not-allowed disabled:text-neutral-800"
    [disabled]="disabled() || !canGoNext()"
    (click)="next()"
    aria-label="Next page"
  >
    <svg lucideChevronRight [size]="16"></svg>
  </button>
</nav>
