<ui-modal
  [open]="open()"
  [heading]="heading()"
  role="alertdialog"
  [closeOnBackdrop]="closeOnBackdrop()"
  [showCloseButton]="showCloseButton()"
  [describedBy]="descriptionId"
  [classNames]="classNames()"
  (closed)="cancel()"
>
  @if (message()) {
    <p [id]="descriptionId" class="text-paragraph-sm text-text-subdued">{{ message() }}</p>
  }
  <ng-content></ng-content>
  <div class="!mt-8 flex justify-end gap-4">
    <button uiButton variant="secondary" [disabled]="loading()" (click)="cancel()">{{
      cancelLabel()
    }}</button>
    <button uiButton [color]="variant() === 'danger' ? 'danger' : 'primary'" [loading]="loading()" (click)="confirm()">{{
      confirmLabel()
    }}</button>
  </div>
</ui-modal>
