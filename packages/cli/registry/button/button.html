@if (loading()) {
  <svg [lucideIcon]="loaderIcon" class="animate-spin block absolute" [size]="16" aria-hidden="true"></svg>
}
<span [class]="loading() ? 'invisible block' : 'flex justify-center items-center gap-2'">
  @if (icon(); as ic) {
    @if (iconPos() === 'left' || variant() === 'icon') {
      <svg [lucideIcon]="ic" [size]="16" aria-hidden="true"></svg>
    }
  }
  <ng-content></ng-content>
  @if (icon(); as ic) {
    @if (iconPos() === 'right' && variant() !== 'icon') {
      <svg [lucideIcon]="ic" [size]="16" aria-hidden="true"></svg>
    }
  }
</span>
