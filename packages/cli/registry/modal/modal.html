@if (open()) {
  <div class="fixed inset-0 z-[9999] flex items-end justify-center sm:items-center">
    <div
      class="absolute inset-0 bg-surface-backdrop"
      aria-hidden="true"
      animate.enter="ui-anim-fade-enter"
      animate.leave="ui-anim-fade-leave"
      (click)="onBackdropClick()"
    ></div>

    <div
      class="relative flex h-full w-full items-end justify-center overflow-y-auto sm:items-center sm:py-24"
    >
      <div
        #panel
        class="relative z-10 max-h-[calc(100vh-2rem)] w-full overflow-y-auto rounded-t-2xl bg-surface-white !px-8 !py-10 sm:max-w-xl sm:rounded-2xl md:max-w-3xl {{
          classNames()
        }}"
        [attr.role]="role()"
        aria-modal="true"
        [attr.aria-labelledby]="heading() || headerTemplate() ? titleId : null"
        [attr.aria-describedby]="describedBy() || null"
        tabindex="-1"
        animate.enter="ui-anim-fade-enter"
        animate.leave="ui-anim-fade-leave"
        (keydown.escape)="close()"
        (keydown.tab)="onKeydownTab($event)"
      >
        @if (showCloseButton()) {
          <button
            type="button"
            aria-label="Close"
            (click)="close()"
            class="absolute right-4 top-4 flex h-8 w-8 cursor-pointer items-center justify-center rounded-full border-none bg-surface-light text-text-primary transition-opacity hover:bg-surface-hover"
          >
            <svg [lucideIcon]="closeIcon" [size]="16"></svg>
          </button>
        }

        @if (headerTemplate(); as tpl) {
          <div [id]="titleId">
            <ng-container [ngTemplateOutlet]="tpl"></ng-container>
          </div>
        } @else if (heading()) {
          <h2 [id]="titleId" class="text-heading-sm text-text-primary !mb-4 !mr-12">
            {{ heading() }}
          </h2>
        }

        @if (contentTemplate(); as tpl) {
          <ng-container [ngTemplateOutlet]="tpl"></ng-container>
        } @else {
          <ng-content></ng-content>
        }

        @if (footerTemplate(); as tpl) {
          <ng-container [ngTemplateOutlet]="tpl"></ng-container>
        }
      </div>
    </div>
  </div>
}
