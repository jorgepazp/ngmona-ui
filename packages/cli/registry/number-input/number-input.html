<div [class]="'flex flex-col ' + classNames()">
  @if (labelTemplate(); as tpl) {
    <div class="mb-1 text-text-subdued text-xs font-semibold flex justify-between">
      <ng-container [ngTemplateOutlet]="tpl"></ng-container>
    </div>
  } @else if (label()) {
    <label [attr.for]="resolvedId()" class="mb-1 text-text-primary text-xs font-semibold block">{{ label() }}</label>
  }

  <ui-input-group [disabled]="isDisabled()" [state]="state()">
    <button
      prefix
      type="button"
      aria-label="Decrease"
      class="flex items-center justify-center w-12 h-12 shrink-0 text-text-primary disabled:text-text-disabled disabled:cursor-not-allowed cursor-pointer hover:bg-surface-light transition-colors"
      [disabled]="!canDecrement()"
      (click)="decrement()"
    >
      <svg [lucideIcon]="minusIcon" [size]="14"></svg>
    </button>

    <input
      [id]="resolvedId()"
      [name]="resolvedId()"
      type="number"
      class="w-32 min-w-0 text-center !px-2 !py-2 text-label-md text-text-subdued h-12 border-none outline-none bg-transparent placeholder:text-text-subdued placeholder:font-normal font-semibold disabled:text-text-disabled [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none"
      [value]="value()"
      [disabled]="isDisabled()"
      [placeholder]="placeholder()"
      [attr.min]="min() ?? null"
      [attr.max]="max() ?? null"
      [attr.step]="step()"
      [attr.aria-describedby]="caption() || captionTemplate() ? captionId() : null"
      (input)="onInputEvent($event)"
      (blur)="onBlurEvent()"
    />

    <button
      suffix
      type="button"
      aria-label="Increase"
      class="flex items-center justify-center w-12 h-12 shrink-0 text-text-primary border-l border-border-neutral disabled:text-text-disabled disabled:cursor-not-allowed cursor-pointer hover:bg-surface-light transition-colors"
      [disabled]="!canIncrement()"
      (click)="increment()"
    >
      <svg [lucideIcon]="plusIcon" [size]="14"></svg>
    </button>
  </ui-input-group>

  @if (captionTemplate(); as tpl) {
    <div [id]="captionId()" class="mt-1 text-xs text-text-subdued">
      <ng-container [ngTemplateOutlet]="tpl"></ng-container>
    </div>
  } @else if (caption()) {
    <small [id]="captionId()" class="mt-1 text-xs text-text-subdued block">{{ caption() }}</small>
  }
</div>
